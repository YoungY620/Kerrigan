name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.toml versions match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          STORAGE_VERSION=$(grep '^version' kerrigan-storage/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          CLI_VERSION=$(grep '^version' kerrigan-cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$STORAGE_VERSION" != "$TAG_VERSION" ] || [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Tag=$TAG_VERSION Storage=$STORAGE_VERSION CLI=$CLI_VERSION"
            exit 1
          fi
          echo "Version consistent: $TAG_VERSION"

  build:
    name: Build ${{ matrix.platform }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build kerrigan-storage
        run: cd kerrigan-storage && cargo build --release --target ${{ matrix.target }}

      - name: Build kerrigan-cli
        run: cd kerrigan-cli && cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp kerrigan-storage/target/${{ matrix.target }}/release/kerrigan-storage artifacts/kerrigan-storage-${{ matrix.platform }}
          cp kerrigan-cli/target/${{ matrix.target }}/release/kerrigan-cli artifacts/kerrigan-cli-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: artifacts/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
