[package]
name = "kerrigan"
version = "1.1.1"
edition = "2024"
description = "DAG-based multi-agent orchestration CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tiny_http = "0.12"
jsonschema = { version = "0.29", default-features = false }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
