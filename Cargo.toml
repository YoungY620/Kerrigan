[package]
name = "kerrigan-cli"
version = "0.1.0"
edition = "2024"
description = "Kerrigan multi-agent orchestration CLI"

[dependencies]
kerrigan-storage = { path = "../kerrigan-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
