stages:
  - check
  - build
  - release

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/registry
    - .cargo/git
    - kerrigan-storage/target/
    - kerrigan-cli/target/

# ── Check ──

check:storage:
  stage: check
  image: rust:latest
  script:
    - cd kerrigan-storage && make check

check:cli:
  stage: check
  image: rust:latest
  script:
    - cd kerrigan-cli && make check

# ── Build (on tag only) ──

.build_base: &build_base
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - rustup target add $RUST_TARGET
    - cd kerrigan-storage && cargo build --release --target $RUST_TARGET && cd ..
    - cd kerrigan-cli && cargo build --release --target $RUST_TARGET && cd ..
    - mkdir -p artifacts
    - cp kerrigan-storage/target/$RUST_TARGET/release/kerrigan-storage artifacts/kerrigan-storage-$PLATFORM
    - cp kerrigan-cli/target/$RUST_TARGET/release/kerrigan-cli artifacts/kerrigan-cli-$PLATFORM
  artifacts:
    paths:
      - artifacts/

build:linux-x86_64:
  <<: *build_base
  image: rust:latest
  variables:
    RUST_TARGET: x86_64-unknown-linux-gnu
    PLATFORM: linux-x86_64

build:linux-aarch64:
  <<: *build_base
  image: rust:latest
  variables:
    RUST_TARGET: aarch64-unknown-linux-gnu
    PLATFORM: linux-aarch64
  before_script:
    - apt-get update && apt-get install -y gcc-aarch64-linux-gnu
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc

build:macos-x86_64:
  <<: *build_base
  tags:
    - macos
  variables:
    RUST_TARGET: x86_64-apple-darwin
    PLATFORM: macos-x86_64

build:macos-aarch64:
  <<: *build_base
  tags:
    - macos
  variables:
    RUST_TARGET: aarch64-apple-darwin
    PLATFORM: macos-aarch64

# ── Release ──

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - build:linux-x86_64
    - build:linux-aarch64
    - build:macos-x86_64
    - build:macos-aarch64
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Kerrigan $CI_COMMIT_TAG"
    assets:
      links:
        - name: kerrigan-storage-linux-x86_64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-storage-linux-x86_64?job=build:linux-x86_64"
        - name: kerrigan-cli-linux-x86_64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-cli-linux-x86_64?job=build:linux-x86_64"
        - name: kerrigan-storage-linux-aarch64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-storage-linux-aarch64?job=build:linux-aarch64"
        - name: kerrigan-cli-linux-aarch64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-cli-linux-aarch64?job=build:linux-aarch64"
        - name: kerrigan-storage-macos-x86_64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-storage-macos-x86_64?job=build:macos-x86_64"
        - name: kerrigan-cli-macos-x86_64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-cli-macos-x86_64?job=build:macos-x86_64"
        - name: kerrigan-storage-macos-aarch64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-storage-macos-aarch64?job=build:macos-aarch64"
        - name: kerrigan-cli-macos-aarch64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/kerrigan-cli-macos-aarch64?job=build:macos-aarch64"
