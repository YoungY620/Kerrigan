stages:
  - check

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/registry
    - .cargo/git
    - target/

check:
  stage: check
  image: rust:latest
  before_script:
    - git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@github.com/YoungY620/harness/kerrigan-storage.git ../kerrigan-storage
  script:
    - make check
