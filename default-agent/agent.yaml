version: 1
agent:
  name: "Kerrigan"
  system_prompt_path: ./system.md
  system_prompt_args:
    ROLE_ADDITIONAL: ""
  tools:
    - "agent_cli.tools.agent:AgentTool"
    - "agent_cli.tools.todo:SetTodoList"
    - "agent_cli.tools.shell:Shell"
    - "agent_cli.tools.file:ReadFile"
    - "agent_cli.tools.file:ReadMediaFile"
    - "agent_cli.tools.file:Glob"
    - "agent_cli.tools.file:Grep"
    - "agent_cli.tools.file:WriteFile"
    - "agent_cli.tools.file:StrReplaceFile"
    - "agent_worker.tools.web:SearchWeb"
    - "agent_worker.tools.web:FetchURL"
    - "agent_worker.tools.introspection:SwitchBrain"
    - "agent_worker.tools.proxy:GetFeishuContext"
    - "agent_worker.tools.proxy:GetSessionId"
    - "agent_worker.tools.proxy:GetChatAnnouncement"
    - "agent_worker.tools.proxy:SendFeishuMessageToUser"
    - "agent_worker.tools.proxy:DownloadFeishuAttachment"
    - "agent_worker.tools.proxy:NotifyDashboard"
    - "agent_worker.tools.proxy:SendMailboxMessage"
    - "agent_worker.tools.ask_user:AskUserQuestion"
    - "agent_worker.tools.scheduler:SetReminder"
    - "agent_worker.tools.scheduler:ListReminders"
    - "agent_worker.tools.scheduler:CancelReminder"
    - "agent_worker.tools.hooks:SubscribeHook"
    - "agent_worker.tools.hooks:UnsubscribeHook"
    - "agent_worker.tools.hooks:ListSubscriptions"
  subagents:
    coder:
      path: ./sub.yaml
      description: "Good at general software engineering tasks."
